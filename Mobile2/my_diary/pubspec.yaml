name: my_diary_mobile
description: "MyDiary 配套移动端 —— 本地优先、开放格式、与桌面端通过对象存储同步互通的日记 App。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 本地存储 / 文件
  path_provider: ^2.1.5
  path: ^1.9.1
  # 哈希与 HMAC（同步引擎文件指纹 + S3 SigV4 签名）
  crypto: ^3.0.6
  # 网络（云服务鉴权 + 预签名 URL 上传/下载）
  http: ^1.4.0
  # 凭据与设置持久化
  shared_preferences: ^2.5.3
  # YAML frontmatter 解析（与桌面端 js-yaml 输出兼容）
  yaml: ^3.1.3
  # 状态管理
  provider: ^6.1.5
  # 日期格式化
  intl: ^0.20.2
  # 图片附件（相册 / 拍照 / 录像）
  image_picker: ^1.1.2
  # 通用附件（音频 / 任意文件）
  file_picker: ^10.1.9
  # 用系统播放器打开音视频与附件
  open_filex: ^4.7.0
  # 生成条目 id
  uuid: ^4.5.1
  # 地图（天地图 WMTS 瓦片，合规持牌源）
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  # 定位（获取当前 GPS 坐标）
  geolocator: ^14.0.2
  # 导出 Markdown zip（打包 vault 中的 .md 与配置）
  archive: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
