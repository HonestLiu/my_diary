name: my_diary_mobile
description: "MyDiary 配套移动端 —— 本地优先、开放格式、与桌面端通过对象存储同步互通的日记 App。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 本地存储 / 文件
  path_provider: ^2.1.5
  path: ^1.9.1
  # 哈希与 HMAC（同步引擎文件指纹 + S3 SigV4 签名）
  crypto: ^3.0.6
  # 网络（云服务鉴权 + 预签名 URL 上传/下载）
  http: ^1.4.0
  # 凭据与设置持久化
  shared_preferences: ^2.5.3
  # YAML frontmatter 解析（与桌面端 js-yaml 输出兼容）
  yaml: ^3.1.3
  # 状态管理
  provider: ^6.1.5
  # 日期格式化
  intl: ^0.20.2
  # 图片附件（相册 / 拍照 / 录像）
  image_picker: ^1.1.2
  # 通用附件（音频 / 任意文件）
  file_picker: ^10.1.9
  # 用系统播放器打开音视频与附件
  open_filex: ^4.7.0
  # 生成条目 id
  uuid: ^4.5.1
  # 地图（天地图 WMTS 瓦片，合规持牌源）
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  # 定位（获取当前 GPS 坐标）
  geolocator: ^14.0.2
  # 导出 Markdown zip（打包 vault 中的 .md 与配置）
  archive: ^4.0.2
  # 分享大文件备份（share sheet 由系统流式传输，避免整包进内存）
  share_plus: ^10.1.0
  video_player: ^2.14.0
  audioplayers: ^6.8.1
  # 图片压缩 + 列表缩略图生成（导入时对原图重压缩并生成 256px 封面）
  flutter_image_compress: ^2.5.1
  # 视频压缩（100% 原生，非 ffmpeg）；按质量预设压缩并抽取封面帧
  video_compress: ^3.1.4
  home_widget: ^0.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # 自定义天气图标字体（iconfont）：Weather 枚举通过 codepoint + fontFamily
  # 渲染成矢量图标，可任意缩放并跟随主题色（详见 lib/models/journal_entry.dart）。
  fonts:
    - family: iconfont
      fonts:
        - asset: assets/fonts/iconfont.ttf
    - family: moodfont
      fonts:
        - asset: assets/fonts/moodfont.ttf
