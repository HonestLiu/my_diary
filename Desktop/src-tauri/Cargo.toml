[package]
name = "my-diary"
version = "0.1.0"
description = "A local-first, open-format journal app"
authors = ["MyDiary"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "my_diary_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ffmpeg-sidecar = "2.5"
# S3-compatible sync client (AWS S3 / Cloudflare R2 / MinIO / Aliyun OSS).
# Hand-rolled SigV4 over reqwest: full control + rustls for HTTPS providers,
# and works against plain-HTTP MinIO during local testing.
reqwest = { version = "0.12", features = ["rustls-tls"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
chrono = "0.4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
