name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 桌面端：Tauri 2，三端各在对应系统的 runner 上原生构建。
  tauri:
    name: Tauri (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            artifact: tauri-linux
            path: |
              Desktop/src-tauri/target/release/bundle/deb/*.deb
              Desktop/src-tauri/target/release/bundle/rpm/*.rpm
              Desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          - name: macOS
            os: macos-latest
            artifact: tauri-macos
            path: Desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - name: Windows
            os: windows-latest
            artifact: tauri-windows
            path: |
              Desktop/src-tauri/target/release/bundle/msi/*.msi
              Desktop/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Desktop/src-tauri

      - name: Install JS dependencies
        working-directory: Desktop
        run: npm ci

      - name: Build Tauri bundles
        working-directory: Desktop
        run: npm run tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  # 移动端：Flutter Android（APK + AAB）。项目无 ios/ 目录，暂不构建 iOS。
  flutter-android:
    name: Flutter (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9' # 与本地开发环境一致（pubspec.lock 要求 flutter >=3.44.0）
          cache: true

      # GitHub 标准 runner 内存有限（约 7GB），本地 gradle.properties 的
      # -Xmx8G 会在 CI 上启动失败，这里仅在工作区覆盖，不改动仓库文件。
      - name: Tune Gradle JVM for CI
        run: |
          sed -i 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError/' \
            Mobile2/my_diary/android/gradle.properties

      - name: Build APK
        working-directory: Mobile2/my_diary
        run: flutter build apk --release

      - name: Build AppBundle (AAB)
        working-directory: Mobile2/my_diary
        run: flutter build appbundle --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flutter-android
          path: |
            Mobile2/my_diary/build/app/outputs/flutter-apk/app-release.apk
            Mobile2/my_diary/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  # 汇总所有产物并发布到 GitHub Releases（仅 tag 触发时执行）。
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [tauri, flutter-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MyDiary v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: artifacts/**
