services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mydiary
      POSTGRES_PASSWORD: mydiary
      POSTGRES_DB: mydiary
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mydiary"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://mydiary:mydiary@db:5432/mydiary
      JWT_SECRET: ${JWT_SECRET:-please-change-me}
      S3_BUCKET: ${S3_BUCKET:-mydiary}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:1420,http://localhost:5173}
    ports:
      - "8000:8000"

volumes:
  pgdata:
