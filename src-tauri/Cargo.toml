[package]
name = "my-diary"
version = "0.1.0"
description = "A local-first, open-format journal app"
authors = ["MyDiary"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "my_diary_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-llm = { git = "https://github.com/crabnebula-dev/tauri-plugin-llm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
